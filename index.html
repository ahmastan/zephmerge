<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="zeph-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Zephmerge</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #fafafa; color-scheme: light; }
      html[data-theme="zeph-dark"] { background-color: #0b0d0e; color-scheme: dark; }
    </style>
    <script>
      // Pick the theme before first paint: saved choice, else the OS setting.
      (function () {
        try {
          var saved = localStorage.getItem('zeph-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'zeph-dark' : 'zeph-light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
